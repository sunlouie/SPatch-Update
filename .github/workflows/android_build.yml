name: Android Build & Package Rename

"on":
  workflow_dispatch:
    inputs:
      old_package:
        description: "Original package name to replace (optional). If empty, auto-detect."
        required: false
        type: string
      new_package:
        description: "New package name"
        required: false
        type: string
        default: "com.whty.ebrowser"
      app_label:
        description: "Application label (display name)"
        required: false
        type: string
        default: "狼分身"
      version_name:
        description: "Version name (e.g. 2.0.1.241130_BYOD)"
        required: false
        type: string
        default: "2.0.1.241130_BYOD"
      version_code:
        description: "Version code (integer)"
        required: false
        type: string
        default: "14"
      keystore_seed:
        description: "Optional seed for deterministic keystore. Empty = random."
        required: false
        type: string
      gradle_task:
        description: "Gradle task to execute"
        required: false
        type: string
        default: "app:assembleRelease"
      api_level:
        description: "Android API level for build tools"
        required: false
        type: string
        default: "33"

jobs:
  build:
    name: "Build & Rename APK"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      - name: "Set up JDK 17"
        uses: "actions/setup-java@v4"
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: "Install utilities"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip grep sed findutils

      - name: "Auto-detect old package"
        id: "detect"
        run: |
          set -euo pipefail
          INPUT_OLD="${{ github.event.inputs.old_package }}"
          
          if [[ -n "$INPUT_OLD" ]]; then
            echo "old_package=$INPUT_OLD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          DETECTED=""
          if [[ -f "app/build.gradle" ]]; then
            DETECTED=$(grep -oP 'applicationId\s*"\K[^"]+' app/build.gradle 2>/dev/null | head -n1) || true
            if [[ -n "$DETECTED" ]]; then
              echo "old_package=$DETECTED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          if [[ -f "app/src/main/AndroidManifest.xml" ]]; then
            DETECTED=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null | head -n1) || true
            if [[ -n "$DETECTED" ]]; then
              echo "old_package=$DETECTED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          DEFAULT="com.android.launcher2"
          echo "old_package=$DEFAULT" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Generate keystore"
        id: "keystore"
        run: |
          set -euo pipefail
          SEED="${{ github.event.inputs.keystore_seed }}"
          
          if [[ -z "$SEED" ]]; then
            SEED=$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
          fi
          
          STOREPASS=$(echo -n "$SEED" | sha256sum | cut -c1-16)
          KEYPASS=$(echo -n "key:$SEED" | sha256sum | cut -c1-16)
          ALIAS="ci-key"
          KEYSTORE="release.keystore"
          
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$KEYSTORE" \
            -storepass "$STOREPASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keypass "$KEYPASS" \
            -dname "CN=CI,OU=Auto,O=GH,C=US" \
            >/dev/null 2>&1
          
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          
          echo "storepass=$STOREPASS" >> "$GITHUB_OUTPUT"
          echo "keypass=$KEYPASS" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Replace package & version"
        env:
          OLD_PKG: "${{ steps.detect.outputs.old_package }}"
          NEW_PKG: "${{ github.event.inputs.new_package }}"
          APP_LABEL: "${{ github.event.inputs.app_label }}"
          VER_NAME: "${{ github.event.inputs.version_name }}"
          VER_CODE: "${{ github.event.inputs.version_code }}"
        run: |
          set -euo pipefail
          
          : "${NEW_PKG:=com.whty.ebrowser}"
          : "${APP_LABEL:=狼分身}"
          : "${VER_NAME:=2.0.1.241130_BYOD}"
          : "${VER_CODE:=14}"
          
          OLD="$OLD_PKG"
          NEW="$NEW_PKG"
          
          OLD_ESC=$(printf '%s' "$OLD" | sed 's/[]\/$*.^[]/\\&/g')
          
          find app/src -type f \( -name '*.java' -o -name '*.kt' -o -name '*.xml' \) \
            ! -path '*/build/*' \
            -exec sed -i "s/${OLD_ESC}/${NEW}/g" {} + || true
          
          if [[ -f "app/build.gradle" ]]; then
            sed -i "s/applicationId[[:space:]]*\"[^\"]*\"/applicationId \"$NEW\"/g" app/build.gradle || true
            sed -i "s/versionName[[:space:]]*\"[^\"]*\"/versionName \"$VER_NAME\"/g" app/build.gradle || true
            sed -i "s/versionCode[[:space:]]*[0-9]\+/versionCode $VER_CODE/g" app/build.gradle || true
          fi
          
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [[ -f "$MANIFEST" ]]; then
            sed -i -E "s/(<manifest[^>]*package=\")([^\"]+)\"/\1${NEW}\"/g" "$MANIFEST" || true
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_LABEL\"/g" "$MANIFEST" || true
          fi
          
          OLD_DIR="app/src/main/java/${OLD//./\/}"
          NEW_DIR="app/src/main/java/${NEW//./\/}"
          if [[ -d "$OLD_DIR" && ! -d "$NEW_DIR" ]]; then
            mkdir -p "$(dirname "$NEW_DIR")"
            mv "$OLD_DIR" "$NEW_DIR" || true
          fi
        shell: bash

      - name: "Configure Gradle signing"
        env:
          SPASS: "${{ steps.keystore.outputs.storepass }}"
          KPASS: "${{ steps.keystore.outputs.keypass }}"
          KALIAS: "${{ steps.keystore.outputs.alias }}"
          KFILE: "${{ steps.keystore.outputs.keystore }}"
        run: |
          set -euo pipefail
          printf '%s\n' \
            "android.injected.signing.store.file=$(pwd)/$KFILE" \
            "android.injected.signing.store.password=$SPASS" \
            "android.injected.signing.key.alias=$KALIAS" \
            "android.injected.signing.key.password=$KPASS" \
            >> gradle.properties
        shell: bash

      # ✅ 核心优化 1：彻底清洗国内镜像，直接使用官方源
      - name: "Remove domestic mirrors from Gradle"
        run: |
          set -euo pipefail
          echo "Replacing domestic mirrors with official repositories..."
          find . -type f \( -name "build.gradle" -o -name "settings.gradle" -o -name "*.gradle" -o -name "*.gradle.kts" \) \
            ! -path "*/build/*" \
            -exec sed -i \
              -e 's|https://maven.aliyun.com/repository/google|https://dl.google.com/dl/android/maven2|g' \
              -e 's|https://maven.aliyun.com/repository/central|https://repo.maven.apache.org/maven2|g' \
              -e 's|https://maven.aliyun.com/repository/public|https://repo.maven.apache.org/maven2|g' \
              -e 's|https://maven.aliyun.com/repository/gradle-plugin|https://plugins.gradle.org/m2|g' \
              -e 's|https://maven.aliyun.com/nexus/content/repositories/releases|https://repo.maven.apache.org/maven2|g' \
              -e 's|https://mirrors.cloud.tencent.com/nexus/content/repositories/releases|https://repo.maven.apache.org/maven2|g' \
              -e 's|https://mirrors.cloud.tencent.com/maven|https://repo.maven.apache.org/maven2|g' \
              -e 's|https://developer.huawei.com/repo|https://maven.google.com|g' \
              {} + || true
          echo "Done. All mirrors replaced with official sources."
        shell: bash

      # ✅ 核心优化 2：鲁棒的 SDK 安装（修复了原方案中无效的 latest.zip 下载链接）
      - name: "Install Android SDK components (robust)"
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          mkdir -p "$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          # 优先使用 Runner 自带的 sdkmanager
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER=$(command -v sdkmanager)
          elif [[ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          fi

          # 兜底：如果自带版本损坏或缺失，下载官方指定版本（注意：Google 不提供 latest.zip，必须带版本号）
          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "sdkmanager not found. Downloading Android commandline tools..."
            TMPDIR="$(mktemp -d)"
            pushd "$TMPDIR"
            CLI_ZIP="commandlinetools-linux-11076708_latest.zip"
            wget -q "https://dl.google.com/android/repository/${CLI_ZIP}" -O "$CLI_ZIP"
            unzip -q "$CLI_ZIP"
            mkdir -p "$SDK_ROOT/cmdline-tools/latest"
            mv cmdline-tools/* "$SDK_ROOT/cmdline-tools/latest/" 2>/dev/null || true
            popd
            rm -rf "$TMPDIR"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          if [[ -z "$SDKMANAGER" || ! -x "$SDKMANAGER" ]]; then
            echo "Error: sdkmanager not found after install attempt!"
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"
          export PATH="$(dirname "$SDKMANAGER"):$PATH"

          yes | "$SDKMANAGER" --licenses || true
          API="${{ inputs.api_level }}"
          "$SDKMANAGER" "platform-tools" "platforms;android-${API}" "build-tools;33.0.2" "platforms;android-33"
        shell: bash

      # ✅ 核心优化 3：构建前校验 Wrapper，防止构建中途崩溃
      - name: "Verify gradle wrapper & versions"
        run: |
          set -euo pipefail
          if [[ -f "./gradlew" ]]; then
            chmod +x ./gradlew
            echo "Gradle wrapper version:"
            ./gradlew --version
          else
            echo "gradlew not found — generating wrapper (Gradle 8.5)"
            sudo apt-get update -y
            sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.5
            chmod +x ./gradlew
            ./gradlew --version
          fi
        shell: bash

      # ✅ 核心优化 4：使用 tee 捕获完整日志，解决 GitHub 网页端日志截断问题
      - name: "Build APK"
        env:
          TASK: "${{ github.event.inputs.gradle_task }}"
        run: |
          set -euo pipefail
          GRADLE_TASK="${TASK:-app:assembleRelease}"
          
          mkdir -p build_logs
          ./gradlew "$GRADLE_TASK" --no-daemon --stacktrace | tee build_logs/gradle_build.log || {
            echo "❌ Build failed. Full stacktrace saved to build_logs/gradle_build.log"
            exit 1
          }
        shell: bash

      # ✅ 核心优化 5：失败时自动上传完整日志 Artifact
      - name: "Upload build logs on failure"
        if: failure()
        uses: "actions/upload-artifact@v4"
        with:
          name: "build-logs"
          path: "build_logs/"
          retention-days: 3

      - name: "Sign APKs"
        env:
          SPASS: "${{ steps.keystore.outputs.storepass }}"
          KPASS: "${{ steps.keystore.outputs.keypass }}"
          KALIAS: "${{ steps.keystore.outputs.alias }}"
          KFILE: "${{ steps.keystore.outputs.keystore }}"
        run: |
          set -euo pipefail
          
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          
          if [[ -z "$APKSIGNER" ]]; then
            echo "Error: apksigner not found in build-tools!"
            exit 1
          fi
          
          mkdir -p out_apks
          shopt -s globstar nullglob
          for apk in app/build/outputs/**/*-unsigned.apk app/build/outputs/**/unsigned/*.apk; do
            [[ -f "$apk" ]] || continue
            [[ "$apk" == *"-signed.apk" || "$apk" == *"debug"* ]] && continue
            
            base=$(basename "$apk" .apk)
            out="out_apks/${base}-signed.apk"
            
            "$APKSIGNER" sign \
              --ks "$KFILE" \
              --ks-key-alias "$KALIAS" \
              --ks-pass "pass:$SPASS" \
              --key-pass "pass:$KPASS" \
              --out "$out" \
              "$apk"
          done
        shell: bash

      - name: "Upload APKs"
        uses: "actions/upload-artifact@v4"
        if: "hashFiles('out_apks/*.apk') != ''"
        with:
          name: "signed-apks"
          path: "out_apks/*.apk"
          retention-days: 7
          if-no-files-found: warn # 修复了原代码中 warnIssue summary 的拼写错误
