name: Android Build & Package Rename

"on":
  workflow_dispatch:
    inputs:
      old_package:
        description: "Original package name to replace (optional). If empty, auto-detect."
        required: false
        type: string
      new_package:
        description: "New package name"
        required: false
        type: string
        default: "com.whty.ebrowser"
      app_label:
        description: "Application label (display name)"
        required: false
        type: string
        default: "狼分身"
      version_name:
        description: "Version name (e.g. 2.0.1.241130_BYOD)"
        required: false
        type: string
        default: "2.0.1.241130_BYOD"
      version_code:
        description: "Version code (integer)"
        required: false
        type: string
        default: "14"
      keystore_seed:
        description: "Optional seed for deterministic keystore. Empty = random."
        required: false
        type: string
      gradle_task:
        description: "Gradle task to execute"
        required: false
        type: string
        default: "app:assembleRelease"
      api_level:
        description: "Android API level for build tools"
        required: false
        type: string
        default: "33"

jobs:
  build:
    name: "Build & Rename APK"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      # ✅ 只需要 setup-java 就足够了，ubuntu-latest 自带 Android SDK
      - name: "Set up JDK 17"
        uses: "actions/setup-java@v4"
        with:
          distribution: "temurin"
          java-version: "17" # 建议用 17，AGP 8.0+ 强制要求
          cache: "gradle"

      - name: "Install utilities"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip grep sed findutils

      - name: "Auto-detect old package"
        id: "detect"
        run: |
          set -euo pipefail
          INPUT_OLD="${{ github.event.inputs.old_package }}"
          
          if [[ -n "$INPUT_OLD" ]]; then
            echo "old_package=$INPUT_OLD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          DETECTED=""
          
          if [[ -f "app/build.gradle" ]]; then
            DETECTED=$(grep -oP 'applicationId\s*"\K[^"]+' app/build.gradle 2>/dev/null | head -n1) || true
            if [[ -n "$DETECTED" ]]; then
              echo "old_package=$DETECTED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          if [[ -f "app/src/main/AndroidManifest.xml" ]]; then
            DETECTED=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml 2>/dev/null | head -n1) || true
            if [[ -n "$DETECTED" ]]; then
              echo "old_package=$DETECTED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          DEFAULT="com.android.launcher2"
          echo "old_package=$DEFAULT" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Generate keystore"
        id: "keystore"
        run: |
          set -euo pipefail
          SEED="${{ github.event.inputs.keystore_seed }}"
          
          if [[ -z "$SEED" ]]; then
            SEED=$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
          fi
          
          STOREPASS=$(echo -n "$SEED" | sha256sum | cut -c1-16)
          KEYPASS=$(echo -n "key:$SEED" | sha256sum | cut -c1-16)
          ALIAS="ci-key"
          KEYSTORE="release.keystore"
          
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$KEYSTORE" \
            -storepass "$STOREPASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keypass "$KEYPASS" \
            -dname "CN=CI,OU=Auto,O=GH,C=US" \
            >/dev/null 2>&1
          
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          
          echo "storepass=$STOREPASS" >> "$GITHUB_OUTPUT"
          echo "keypass=$KEYPASS" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Replace package & version"
        env:
          OLD_PKG: "${{ steps.detect.outputs.old_package }}"
          NEW_PKG: "${{ github.event.inputs.new_package }}"
          APP_LABEL: "${{ github.event.inputs.app_label }}"
          VER_NAME: "${{ github.event.inputs.version_name }}"
          VER_CODE: "${{ github.event.inputs.version_code }}"
        run: |
          set -euo pipefail
          
          : "${NEW_PKG:=com.whty.ebrowser}"
          : "${APP_LABEL:=狼分身}"
          : "${VER_NAME:=2.0.1.241130_BYOD}"
          : "${VER_CODE:=14}"
          
          OLD="$OLD_PKG"
          NEW="$NEW_PKG"
          
          OLD_ESC=$(printf '%s' "$OLD" | sed 's/[]\/$*.^[]/\\&/g')
          
          find app/src -type f \( -name '*.java' -o -name '*.kt' -o -name '*.xml' \) \
            ! -path '*/build/*' \
            -exec sed -i "s/${OLD_ESC}/${NEW}/g" {} + || true
          
          if [[ -f "app/build.gradle" ]]; then
            sed -i "s/applicationId[[:space:]]*\"[^\"]*\"/applicationId \"$NEW\"/g" app/build.gradle || true
            sed -i "s/versionName[[:space:]]*\"[^\"]*\"/versionName \"$VER_NAME\"/g" app/build.gradle || true
            sed -i "s/versionCode[[:space:]]*[0-9]\+/versionCode $VER_CODE/g" app/build.gradle || true
          fi
          
          MANIFEST="app/src/main/AndroidManifest.xml"
          if [[ -f "$MANIFEST" ]]; then
            sed -i -E "s/(<manifest[^>]*package=\")([^\"]+)\"/\1${NEW}\"/g" "$MANIFEST" || true
            sed -i "s/android:label=\"[^\"]*\"/android:label=\"$APP_LABEL\"/g" "$MANIFEST" || true
          fi
          
          OLD_DIR="app/src/main/java/${OLD//./\/}"
          NEW_DIR="app/src/main/java/${NEW//./\/}"
          if [[ -d "$OLD_DIR" && ! -d "$NEW_DIR" ]]; then
            mkdir -p "$(dirname "$NEW_DIR")"
            mv "$OLD_DIR" "$NEW_DIR" || true
          fi
        shell: bash

      - name: "Configure Gradle signing"
        env:
          SPASS: "${{ steps.keystore.outputs.storepass }}"
          KPASS: "${{ steps.keystore.outputs.keypass }}"
          KALIAS: "${{ steps.keystore.outputs.alias }}"
          KFILE: "${{ steps.keystore.outputs.keystore }}"
        run: |
          set -euo pipefail
          cat >> gradle.properties << EOF
          android.injected.signing.store.file=$(pwd)/$KFILE
          android.injected.signing.store.password=$SPASS
          android.injected.signing.key.alias=$KALIAS
          android.injected.signing.key.password=$KPASS
          EOF
        shell: bash

      - name: "Build APK"
        env:
          TASK: "${{ github.event.inputs.gradle_task }}"
        run: |
          set -euo pipefail
          GRADLE_TASK="${TASK:-app:assembleRelease}"
          
          if [[ -x "./gradlew" ]]; then
            ./gradlew "$GRADLE_TASK" --no-daemon
          else
            sudo apt-get install -y gradle
            gradle wrapper --gradle-version 8.5
            ./gradlew "$GRADLE_TASK" --no-daemon
          fi
        shell: bash

      - name: "Sign APKs"
        env:
          SPASS: "${{ steps.keystore.outputs.storepass }}"
          KPASS: "${{ steps.keystore.outputs.keypass }}"
          KALIAS: "${{ steps.keystore.outputs.alias }}"
          KFILE: "${{ steps.keystore.outputs.keystore }}"
        run: |
          set -euo pipefail
          
          # ✅ 动态查找 apksigner，不再写死 33.0.2，防止镜像更新后找不到文件
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          
          if [[ -z "$APKSIGNER" ]]; then
            echo "Error: apksigner not found in build-tools!"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          
          mkdir -p out_apks
          
          shopt -s globstar nullglob
          for apk in app/build/outputs/**/*-unsigned.apk app/build/outputs/**/unsigned/*.apk; do
            [[ -f "$apk" ]] || continue
            [[ "$apk" == *"-signed.apk" || "$apk" == *"debug"* ]] && continue
            
            base=$(basename "$apk" .apk)
            out="out_apks/${base}-signed.apk"
            
            "$APKSIGNER" sign \
              --ks "$KFILE" \
              --ks-key-alias "$KALIAS" \
              --ks-pass "pass:$SPASS" \
              --key-pass "pass:$KPASS" \
              --out "$out" \
              "$apk"
          done
        shell: bash

      - name: "Upload APKs"
        uses: "actions/upload-artifact@v4"
        if: "hashFiles('out_apks/*.apk') != ''"
        with:
          name: "signed-apks"
          path: "out_apks/*.apk"
          retention-days: 7
          if-no-files-found: warn
