name: Android Build & Package Rename

"on":
  workflow_dispatch:
    inputs:
      old_package:
        description: "Original package name to replace (optional). If empty, auto-detect."
        required: false
        type: string
      new_package:
        description: "New package name"
        required: false
        type: string
        default: "com.whty.ebrowser"
      app_label:
        description: "Application label (display name)"
        required: false
        type: string
        default: "狼分身"
      version_name:
        description: "Version name (e.g. 2.0.1.241130_BYOD)"
        required: false
        type: string
        default: "2.0.1.241130_BYOD"
      version_code:
        description: "Version code (integer)"
        required: false
        type: string
        default: "14"
      keystore_seed:
        description: "Optional seed for deterministic keystore. Empty = random."
        required: false
        type: string
      gradle_task:
        description: "Gradle task to execute"
        required: false
        type: string
        default: "app:assembleRelease"
      api_level:
        description: "Android API level for build tools"
        required: false
        type: string
        default: "33"

jobs:
  build:
    name: "Build & Rename APK"
    runs-on: "ubuntu-latest"
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: "actions/checkout@v4"
        with:
          fetch-depth: 0

      # ==========================================
      # 核心修复步骤：自动检测环境、修复编码、对齐版本
      # ==========================================
      - name: "Detect project requirements and auto-fix compatibility"
        id: "detect_fix"
        run: |
          set -euo pipefail
          python3 << 'PYEOF'
import os
import re
import sys

gradle_ver = "7.5" # 默认 Gradle 版本
agp_ver = None

# 1. 读取项目指定的 Gradle 版本
props_file = "gradle/wrapper/gradle-wrapper.properties"
if os.path.exists(props_file):
    with open(props_file, 'r', encoding='utf-8') as f:
        for line in f:
            if "distributionUrl" in line:
                m = re.search(r'gradle-([\d.]+)', line)
                if m:
                    gradle_ver = m.group(1)
                    break
                    
print(f"Detected Gradle version: {gradle_ver}")

# 2. 根据 Gradle 版本推导兼容的 JDK 和 AGP 版本
try:
    gradle_major = int(gradle_ver.split('.')[0])
except:
    gradle_major = 7

if gradle_major >= 8:
    target_jdk = "17"
    target_agp = "8.1.4"
elif gradle_major >= 7:
    if gradle_ver >= "7.3":
        target_jdk = "17"
        target_agp = "7.4.2"
    else:
        target_jdk = "11"
        target_agp = "7.2.2"
else:
    target_jdk = "11"
    target_agp = "4.2.2"
    
# 3. 自动清理所有 Gradle 文件的 BOM 头 (防止 Gradle 解析第一行时崩溃)
for root, dirs, files in os.walk('.'):
    if 'build' in root or '.gradle' in root or '.git' in root:
        continue
    for file in files:
        if file.endswith('.gradle') or file.endswith('.gradle.kts'):
            filepath = os.path.join(root, file)
            try:
                with open(filepath, 'r', encoding='utf-8-sig') as f:
                    content = f.read()
                with open(filepath, 'w', encoding='utf-8') as f:
                    f.write(content)
            except Exception:
                pass
                
# 4. 尝试读取项目现有的 AGP 版本
build_files = ["build.gradle", "build.gradle.kts"]
for bf in build_files:
    if os.path.exists(bf):
        with open(bf, 'r', encoding='utf-8') as f:
            content = f.read()
        m = re.search(r"com\.android\.tools\.build:gradle:([\d.]+)", content)
        if m:
            agp_ver = m.group(1)
            
settings_files = ["settings.gradle", "settings.gradle.kts"]
for sf in settings_files:
    if os.path.exists(sf):
        with open(sf, 'r', encoding='utf-8') as f:
            content = f.read()
        m = re.search(r"id\s*\(?\s*['\"]com\.android\.application['\"]\s*\)?\s+version\s+['\"]([\d.]+)['\"]", content)
        if m:
            agp_ver = m.group(1)
            
print(f"Detected AGP version: {agp_ver}")

# 5. 如果现有 AGP 版本与推导的 JDK 冲突，进行动态调整
if agp_ver:
    try:
        agp_major = int(agp_ver.split('.')[0])
        if agp_major >= 8 and target_jdk == "11":
            target_jdk = "17" # 老 JDK 跑不动 AGP 8+，强制升级 JDK
        elif agp_major < 7 and target_jdk == "17":
            target_jdk = "11" # 新 JDK 跑不动老 AGP，强制降级 JDK 保平安
            target_agp = agp_ver 
    except:
        pass
        
print(f"Final target JDK: {target_jdk}")
print(f"Final target AGP: {target_agp}")

# 6. 自动修复 build.gradle / build.gradle.kts，确保 AGP 版本正确且存在
for bf in build_files:
    if os.path.exists(bf):
        is_kts = bf.endswith('.kts')
        with open(bf, 'r', encoding='utf-8') as f:
            content = f.read()
            
        pattern = r"com\.android\.tools\.build:gradle:[\d\.]+"
        if re.search(pattern, content):
            new_content = re.sub(pattern, f"com.android.tools.build:gradle:{target_agp}", content)
        else:
            dep_pattern = r"(buildscript\s*\{[^}]*dependencies\s*\{)"
            if re.search(dep_pattern, content, re.DOTALL):
                if is_kts:
                    inject_str = f'\n        classpath("com.android.tools.build:gradle:{target_agp}")'
                else:
                    inject_str = f"\n        classpath 'com.android.tools.build:gradle:{target_agp}'"
                new_content = re.sub(dep_pattern, f"\\1{inject_str}", content, count=1)
            else:
                if is_kts:
                    inject = f"\nbuildscript {{\n    repositories {{\n        google()\n        mavenCentral()\n    }}\n    dependencies {{\n        classpath(\"com.android.tools.build:gradle:{target_agp}\")\n    }}\n}}\n"
                else:
                    inject = f"\nbuildscript {{\n    repositories {{\n        google()\n        mavenCentral()\n    }}\n    dependencies {{\n        classpath 'com.android.tools.build:gradle:{target_agp}'\n    }}\n}}\n"
                new_content = inject + content
                
        with open(bf, 'w', encoding='utf-8') as f:
            f.write(new_content)

# 7. 自动修复 settings.gradle 的 plugins DSL
for sf in settings_files:
    if os.path.exists(sf):
        with open(sf, 'r', encoding='utf-8') as f:
            content = f.read()
        plugin_pattern = r"(id\s*\(?\s*['\"]com\.android\.application['\"]\s*\)?\s+version\s+['\"])[\d\.]+(['\"])"
        
        new_content = content
        if re.search(plugin_pattern, content):
            new_content = re.sub(plugin_pattern, f"\\g<1>{target_agp}\\g<2>", content)
            
        if new_content != content:
            with open(sf, 'w', encoding='utf-8') as f:
                f.write(new_content)

# 输出变量供后续步骤使用
with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
    f.write(f"jdk_version={target_jdk}\n")
    f.write(f"agp_version={target_agp}\n")
    f.write(f"gradle_version={gradle_ver}\n")
PYEOF
        shell: bash

      # ==========================================
      # 使用动态检测到的 JDK 版本
      # ==========================================
      - name: "Set up JDK"
        uses: "actions/setup-java@v4"
        with:
          distribution: "temurin"
          java-version: "${{ steps.detect_fix.outputs.jdk_version }}"
          cache: "gradle"

      - name: "Install utilities"
        run: |
          sudo apt-get update -y
          sudo apt-get install -y zip unzip grep sed findutils

      - name: "Auto-detect old package"
        id: "detect"
        run: |
          set -euo pipefail
          INPUT_OLD="${{ github.event.inputs.old_package }}"
          
          if [[ -n "$INPUT_OLD" ]]; then
            echo "old_package=$INPUT_OLD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          
          DETECTED=""
          if [[ -f "app/build.gradle" ]]; then
            DETECTED=$(sed -n 's/.*applicationId[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle 2>/dev/null | head -n1) || true
            if [[ -n "$DETECTED" ]]; then
              echo "old_package=$DETECTED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          if [[ -f "app/src/main/AndroidManifest.xml" ]]; then
            DETECTED=$(sed -n 's/.*package="\([^"]*\)".*/\1/p' app/src/main/AndroidManifest.xml 2>/dev/null | head -n1) || true
            if [[ -n "$DETECTED" ]]; then
              echo "old_package=$DETECTED" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          
          DEFAULT="com.android.launcher2"
          echo "old_package=$DEFAULT" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Generate keystore"
        id: "keystore"
        run: |
          set -euo pipefail
          SEED="${{ github.event.inputs.keystore_seed }}"
          
          if [[ -z "$SEED" ]]; then
            SEED=$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
          fi
          
          STOREPASS=$(echo -n "$SEED" | sha256sum | cut -c1-16)
          KEYPASS=$(echo -n "key:$SEED" | sha256sum | cut -c1-16)
          ALIAS="ci-key"
          KEYSTORE="release.keystore"
          
          keytool -genkeypair -v \
            -storetype JKS \
            -keystore "$KEYSTORE" \
            -storepass "$STOREPASS" \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -keypass "$KEYPASS" \
            -dname "CN=CI,OU=Auto,O=GH,C=US" \
            >/dev/null 2>&1
          
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          
          echo "storepass=$STOREPASS" >> "$GITHUB_OUTPUT"
          echo "keypass=$KEYPASS" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "keystore=$KEYSTORE" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Replace package & version"
        env:
          OLD_PKG: "${{ steps.detect.outputs.old_package }}"
          NEW_PKG: "${{ github.event.inputs.new_package }}"
          APP_LABEL: "${{ github.event.inputs.app_label }}"
          VER_NAME: "${{ github.event.inputs.version_name }}"
          VER_CODE: "${{ github.event.inputs.version_code }}"
        run: |
          set -euo pipefail
          
          : "${NEW_PKG:=com.whty.ebrowser}"
          : "${APP_LABEL:=狼分身}"
          : "${VER_NAME:=2.0.1.241130_BYOD}"
          : "${VER_CODE:=14}"
          
          OLD="$OLD_PKG"
          NEW="$NEW_PKG"
          
          OLD_ESC=$(printf '%s' "$OLD" | sed -e 's/[\/&]/\\&/g')
          
          find app/src -type f \( -name '*.java' -o -name '*.kt' -o -name
