name: Android Build & Package Rename

on:
  workflow_dispatch:
    inputs:
      old_package:
        description: "Original package name to replace (optional). If empty, auto-detect."
        required: false
        type: string
      new_package:
        description: "New package name"
        required: false
        type: string
        default: "com.whty.ebrowser"
      app_label:
        description: "Application label (display name)"
        required: false
        type: string
        default: "狼分身"
      version_name:
        description: "Version name (e.g. 2.0.1.241130_BYOD)"
        required: false
        type: string
        default: "2.0.1.241130_BYOD"
      version_code:
        description: "Version code (integer)"
        required: false
        type: string
        default: "14"
      keystore_seed:
        description: "Optional seed for deterministic keystore. Empty = random."
        required: false
        type: string
      gradle_task:
        description: "Gradle task to execute"
        required: false
        type: string
        default: "app:assembleRelease"
      api_level:
        description: "Android API level for build tools"
        required: false
        type: string
        default: "33"

jobs:
  build:
    name: "Build & Rename APK"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect project requirements and auto-fix compatibility
        id: detect_fix
        run: |
          echo "" | base64 -d > /tmp/detect_fix.py
          python3 /tmp/detect_fix.py

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.detect_fix.outputs.jdk_version }}
          cache: gradle

      - name: Install utilities
        run: sudo apt-get update -y && sudo apt-get install -y zip unzip

      - name: Auto-detect old package
        id: detect
        run: |
          set -euo pipefail
          INPUT_OLD="${{ github.event.inputs.old_package }}"
          if [[ -n "$INPUT_OLD" ]]; then
            echo "old_package=$INPUT_OLD" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DETECTED=""
          if [[ -f "app/build.gradle" ]]; then
            DETECTED=$(grep -oP 'applicationId\s+"\K[^"]+' app/build.gradle | head -n1 || true)
          fi
          if [[ -z "$DETECTED" ]] && [[ -f "app/build.gradle.kts" ]]; then
            DETECTED=$(grep -oP 'applicationId\s*=\s*"\K[^"]+' app/build.gradle.kts | head -n1 || true)
          fi
          if [[ -z "$DETECTED" ]] && [[ -f "app/src/main/AndroidManifest.xml" ]]; then
            DETECTED=$(grep -oP 'package="\K[^"]+' app/src/main/AndroidManifest.xml | head -n1 || true)
          fi
          if [[ -z "$DETECTED" ]]; then
            DETECTED="com.android.launcher2"
            echo "::warning::Could not auto-detect package name; falling back to $DETECTED"
          fi
          echo "Detected old package: $DETECTED"
          echo "old_package=$DETECTED" >> "$GITHUB_OUTPUT"

      - name: Generate keystore
        id: keystore
        run: |
          set -euo pipefail
          SEED="${{ github.event.inputs.keystore_seed }}"
          if [[ -z "$SEED" ]]; then
            SEED=$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 32)
          fi
          STOREPASS=$(echo -n "$SEED"      | sha256sum | cut -c1-16)
          KEYPASS=$(  echo -n "key:$SEED"  | sha256sum | cut -c1-16)
          ALIAS="ci-key"
          KEYSTORE="release.keystore"
          keytool -genkeypair -v             -storetype JKS             -keystore  "$KEYSTORE"             -storepass "$STOREPASS"             -alias     "$ALIAS"             -keyalg RSA -keysize 2048             -validity  10000             -keypass   "$KEYPASS"             -dname     "CN=CI,OU=Auto,O=GH,C=US"             > /dev/null 2>&1
          echo "::add-mask::$STOREPASS"
          echo "::add-mask::$KEYPASS"
          echo "storepass=$STOREPASS" >> "$GITHUB_OUTPUT"
          echo "keypass=$KEYPASS"     >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS"         >> "$GITHUB_OUTPUT"
          echo "keystore=$KEYSTORE"   >> "$GITHUB_OUTPUT"

      - name: Replace package and version
        env:
          OLD_PKG:   "${{ steps.detect.outputs.old_package }}"
          NEW_PKG:   "${{ github.event.inputs.new_package }}"
          APP_LABEL: "${{ github.event.inputs.app_label }}"
          VER_NAME:  "${{ github.event.inputs.version_name }}"
          VER_CODE:  "${{ github.event.inputs.version_code }}"
        run: |
          set -euo pipefail
          : "${NEW_PKG:?new_package input is required}"
          : "${OLD_PKG:?old_package could not be detected}"
          echo "Replacing package: $OLD_PKG -> $NEW_PKG"
          find . \( -name "build.gradle" -o -name "build.gradle.kts" \)                -not -path "*/build/*" | while read -r f; do
            sed -i "s|applicationId[[:space:]]*\"${OLD_PKG}\"|applicationId \"${NEW_PKG}\"|g" "$f"
            sed -i "s|applicationId[[:space:]]*=[[:space:]]*\"${OLD_PKG}\"|applicationId = \"${NEW_PKG}\"|g" "$f"
          done
          find . -name "AndroidManifest.xml" -not -path "*/build/*" | while read -r f; do
            sed -i "s|package=\"${OLD_PKG}\"|package=\"${NEW_PKG}\"|g" "$f"
          done
          find . \( -name "*.java" -o -name "*.kt" \) -not -path "*/build/*" | while read -r f; do
            sed -i "s|^package ${OLD_PKG}|package ${NEW_PKG}|g" "$f"
            sed -i "s|import ${OLD_PKG}\.|import ${NEW_PKG}.|g" "$f"
          done
          if [[ -n "$APP_LABEL" ]]; then
            find . -name "strings.xml" -not -path "*/build/*" | while read -r f; do
              sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_LABEL}</string>|g" "$f"
            done
          fi
          if [[ -f "app/build.gradle" ]]; then
            sed -i "s|versionName[[:space:]]*\"[^\"]*\"|versionName \"${VER_NAME}\"|g"  app/build.gradle
            sed -i "s|versionCode[[:space:]]*[0-9]*|versionCode ${VER_CODE}|g"          app/build.gradle
          fi
          if [[ -f "app/build.gradle.kts" ]]; then
            sed -i "s|versionName[[:space:]]*=[[:space:]]*\"[^\"]*\"|versionName = \"${VER_NAME}\"|g" app/build.gradle.kts
            sed -i "s|versionCode[[:space:]]*=[[:space:]]*[0-9]*|versionCode = ${VER_CODE}|g"        app/build.gradle.kts
          fi
          echo "Package and version replacement complete."

      - name: Inject signing config
        env:
          KEYSTORE_PATH: "${{ github.workspace }}/${{ steps.keystore.outputs.keystore }}"
          STORE_PASS:    "${{ steps.keystore.outputs.storepass }}"
          KEY_ALIAS:     "${{ steps.keystore.outputs.alias }}"
          KEY_PASS:      "${{ steps.keystore.outputs.keypass }}"
        run: |
          echo "" | base64 -d > /tmp/inject_signing.py
          python3 /tmp/inject_signing.py

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=false"
        run: |
          ./gradlew "${{ github.event.inputs.gradle_task }}"             --no-daemon             --stacktrace             -Pandroid.injected.signing.store.file="${{ github.workspace }}/${{ steps.keystore.outputs.keystore }}"             -Pandroid.injected.signing.store.password="${{ steps.keystore.outputs.storepass }}"             -Pandroid.injected.signing.key.alias="${{ steps.keystore.outputs.alias }}"             -Pandroid.injected.signing.key.password="${{ steps.keystore.outputs.keypass }}"

      - name: Locate and rename APK
        id: apk
        run: |
          set -euo pipefail
          APK_PATH=$(find . -path "*/build/outputs/apk/release/*.apk" | head -n1)
          if [[ -z "$APK_PATH" ]]; then
            echo "::error::No release APK found under build/outputs/apk/release/"
            exit 1
          fi
          NEW_PKG="${{ github.event.inputs.new_package }}"
          VER_NAME="${{ github.event.inputs.version_name }}"
          DEST_NAME="${NEW_PKG}_${VER_NAME}.apk"
          DEST_DIR="$(dirname "$APK_PATH")"
          DEST_PATH="$DEST_DIR/$DEST_NAME"
          mv "$APK_PATH" "$DEST_PATH"
          echo "apk_path=$DEST_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_name=$DEST_NAME" >> "$GITHUB_OUTPUT"
          echo "Renamed APK: $DEST_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.apk_name }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 7
          if-no-files-found: error
